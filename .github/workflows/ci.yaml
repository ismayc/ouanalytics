name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::covr
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: false
      - name: Tests and the 100% coverage gate
        run: Rscript r/tools/check.R

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tests (100% line and branch coverage)
        working-directory: python
        run: |
          pip install . pytest pytest-cov
          pytest

  # Re-run R on the golden inputs. If golden/ would change, an R change landed
  # without its golden files; then check that Python still matches.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Regenerate golden/ with R
        run: |
          R CMD INSTALL r
          Rscript r/tools/make-golden.R
      - name: Fail if golden/ changed
        run: git diff --exit-code --stat golden
      - name: Compare Python with R on every golden case
        run: |
          pip install ./python
          ouanalytics-check golden/*
